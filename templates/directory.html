<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141415">
  <title>DetailQuote-US — Live Shop Demos</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
        </div>
        <div>
          <div class="brand-name">DetailQuote-US</div>
          <div class="brand-meta">Multi-tenant demo launcher for US mobile detailing outreach</div>
        </div>
      </div>
      <div class="topbar-right">
        <span class="slot-pill tabular" id="tenantCountPill">Loading shops</span>
      </div>
    </header>

    <div class="page-header">
      <h1 class="page-title">Configured shop demos</h1>
      <p class="page-sub">Each shop gets a branded instant quote link, live vehicle scope preview, customer tracking page, and PIN-protected owner cabinet on one server</p>
    </div>

    <div class="directory-grid" id="tenantsGrid"></div>
  </div>

  <script>
    (() => {
      const grid = document.getElementById("tenantsGrid");
      const countPill = document.getElementById("tenantCountPill");

      function escapeHtml(str) {
        return String(str || "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      async function load() {
        const res = await fetch("/api/tenants");
        const data = await res.json();
        const tenants = data.tenants || [];
        countPill.textContent = `${tenants.length} active demos`;

        grid.innerHTML = tenants
          .map((t) => {
            const origin = window.location.origin;
            const demoUrl = `${origin}/s/${t.slug}`;
            const pitch = `Hey ${t.shop_name} team — saw you handle mobile detailing in ${t.city}. I built a quick 60-second instant quote & photo booking page using your local area (${demoUrl}) so clients can upload photos and get a price range without phone tag. Worth a quick look?`;
            return `
              <article class="card">
                <div class="section-head">
                  <div>
                    <div class="brand-meta tabular">${escapeHtml(t.slug)} · ${escapeHtml(t.city)}, ${escapeHtml(t.state)}</div>
                    <h2 class="section-title" style="font-size: 18px; margin-top: 4px;">${escapeHtml(t.shop_name)}</h2>
                  </div>
                  <span class="badge" style="border-color: ${escapeHtml(t.accent_color)}; color: ${escapeHtml(t.accent_color)};">-$${t.promo_credit} promo</span>
                </div>

                <div class="summary-rows" style="margin-top: 0; border-top: none; padding-top: 0; margin-bottom: 16px;">
                  <div class="summary-row"><span>Phone</span><span class="tabular">${escapeHtml(t.phone)}</span></div>
                  <div class="summary-row"><span>Instagram</span><span>${escapeHtml(t.instagram || "Not set")}</span></div>
                  <div class="summary-row"><span>Packages</span><span class="tabular">${t.package_count} configured</span></div>
                </div>

                <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                  <a class="btn btn-primary btn-sm" href="/s/${escapeHtml(t.slug)}">Open quote PWA</a>
                  <a class="btn btn-secondary btn-sm" href="/s/${escapeHtml(t.slug)}/owner">Owner cabinet</a>
                  <button type="button" class="btn btn-secondary btn-sm" data-pitch="${escapeHtml(pitch)}">Copy cold DM</button>
                </div>
              </article>
            `;
          })
          .join("");

        grid.querySelectorAll("[data-pitch]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            await navigator.clipboard.writeText(btn.dataset.pitch).catch(() => null);
            btn.textContent = "DM copied";
            setTimeout(() => {
              btn.textContent = "Copy cold DM";
            }, 1600);
          });
        });
      }

      load();
    })();
  </script>
</body>
</html>
